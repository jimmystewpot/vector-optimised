name: 🚀 Build & Release Hardware-Optimized Vector

'on':
  schedule:
    # Run once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Specific upstream tag to build (e.g. v0.46.0)'
        required: false
        type: string
        default: ''
      skip_arm:
        description: 'Skip ephemeral GCP ARM build'
        required: false
        type: boolean
        default: false
      skip_x86:
        description: 'Skip x86 ARC runner build'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write

env:
  GCP_PROJECT: 'oranged-experimentation'
  GCP_ZONE: 'europe-north1-a'

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Upstream Release Check
  # ---------------------------------------------------------------------------
  check-upstream:
    name: 🔍 Check Upstream Releases
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      target_tag: ${{ steps.check.outputs.target_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for unbuilt release
        id: check
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-upstream-release.sh "${{ inputs.force_tag }}"

  # ---------------------------------------------------------------------------
  # Step 2: x86_64 Build (Runs on ARC Kubernetes Runner)
  # ---------------------------------------------------------------------------
  build-x86:
    name: 🔨 Build x86_64 (x86-64-v3)
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true' && !inputs.skip_x86
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libssl-dev pkg-config libsasl2-dev \
            curl jq git protobuf-compiler libz-dev gcc-14 g++-14 || true
          if command -v gcc-14 >/dev/null 2>&1; then
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14 || true
          fi
          gcc --version

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Shallow clone upstream Vector tag
        run: |
          rm -rf vector-src
          git clone --depth 1 --branch "${{ needs.check-upstream.outputs.target_tag }}" \
            https://github.com/vectordotdev/vector.git vector-src

      - name: Compile Vector with x86-64-v3 optimizations
        run: |
          cd vector-src
          export CFLAGS="-O3 -march=x86-64-v3"
          export CXXFLAGS="-O3 -march=x86-64-v3"
          export RUSTFLAGS="-C target-cpu=x86-64-v3 -C panic=abort -C link-arg=-Wl,--gc-sections -C link-arg=-Wl,-O3"
          cargo build --release
          strip target/release/vector || true

      - name: Package tarball
        run: |
          chmod +x scripts/*.sh
          ./scripts/package-tarball.sh "${{ needs.check-upstream.outputs.target_tag }}" "x86_64-unknown-linux-gnu-v3"

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-${{ needs.check-upstream.outputs.target_tag }}-x86_64
          path: artifacts/*.tar.gz

  # ---------------------------------------------------------------------------
  # Step 3: Launch Ephemeral ARM64 Runner (Google Cloud Axion C4A SPOT VM)
  # ---------------------------------------------------------------------------
  launch-arm-runner:
    name: ☁️ Launch GCE Axion C4A Runner
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true' && !inputs.skip_arm
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-vm.outputs.runner-label }}
      instance-name: ${{ steps.create-vm.outputs.instance-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "gha-arm-runner@oranged-experimentation.iam.gserviceaccount.com"

      - name: Generate GitHub App Runner Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARM_RUNNER_APP_ID }}
          private-key: ${{ secrets.ARM_RUNNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Provision Spot C4A Instance
        id: create-vm
        run: |
          INSTANCE_NAME="gce-arm-${{ github.run_id }}-${{ github.run_attempt }}"
          RUNNER_LABEL="gce-arm-${{ github.run_id }}"

          REG_TOKEN=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token" | jq -r .token)

          if [[ -z "${REG_TOKEN}" || "${REG_TOKEN}" == "null" ]]; then
            echo "Error: Failed to obtain runner registration token from GitHub API" >&2
            exit 1
          fi

          echo "runner-label=${RUNNER_LABEL}" >> "$GITHUB_OUTPUT"
          echo "instance-name=${INSTANCE_NAME}" >> "$GITHUB_OUTPUT"

          gcloud compute instances create "${INSTANCE_NAME}" \
            --project="${{ env.GCP_PROJECT }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --machine-type="c4a-standard-4" \
            --provisioning-model=SPOT \
            --instance-termination-action=DELETE \
            --max-run-duration=30m \
            --image-family="ubuntu-minimal-2404-lts-arm64" \
            --image-project="ubuntu-os-cloud" \
            --boot-disk-size=50GB \
            --metadata="^:::^github-repo=${{ github.repository }}:::runner-token=${REG_TOKEN}:::runner-labels=self-hosted,linux,arm64,${RUNNER_LABEL}" \
            --metadata-from-file=startup-script=scripts/gce-arm-bootstrap.sh

  # ---------------------------------------------------------------------------
  # Step 4: ARM64 Build (Runs in Container on Ephemeral C4A Runner)
  # ---------------------------------------------------------------------------
  build-arm:
    name: 🔨 Build ARM64 (Axion Neoverse-V2 / LSE+CRC)
    needs: [check-upstream, launch-arm-runner]
    runs-on: [self-hosted, "${{ needs.launch-arm-runner.outputs.runner-label }}"]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Architecture & Engine
        run: |
          uname -m
          lscpu | grep "Model name\|Architecture" || true
          docker info

      - name: Build Vector in Ubuntu 24.04 Container
        run: |
          docker run --rm \
            -e TARGET_TAG="${{ needs.check-upstream.outputs.target_tag }}" \
            -v "$(pwd):/workspace" \
            -w /workspace \
            ubuntu:24.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qy && apt-get install -qy --no-install-recommends \
                build-essential clang cmake libssl-dev pkg-config libsasl2-dev \
                curl jq git protobuf-compiler libz-dev gcc g++ ca-certificates

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source "$HOME/.cargo/env"

              rm -rf vector-src
              git clone --depth 1 --branch "${TARGET_TAG}" \
                https://github.com/vectordotdev/vector.git vector-src

              cd vector-src
              export CFLAGS="-O3 -march=armv8.2-a+lse+crc"
              export CXXFLAGS="-O3 -march=armv8.2-a+lse+crc"
              export RUSTFLAGS="-C target-feature=+lse,+crc -C panic=abort -C link-arg=-Wl,--gc-sections -C link-arg=-Wl,-O3"
              cargo build --release
              strip target/release/vector || true
              cd /workspace

              chmod +x scripts/*.sh
              ./scripts/package-tarball.sh "${TARGET_TAG}" "aarch64-unknown-linux-gnu-lse"
              chown -R "$(stat -c "%u:%g" /workspace)" /workspace/artifacts /workspace/target /workspace/vector-src 2>/dev/null || chmod -R a+rwX /workspace || true
            '

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-${{ needs.check-upstream.outputs.target_tag }}-arm64
          path: artifacts/*.tar.gz

  # ---------------------------------------------------------------------------
  # Step 5: Teardown Ephemeral ARM64 Runner
  # ---------------------------------------------------------------------------
  teardown-arm-runner:
    name: 🧹 Teardown GCE Axion C4A Runner
    needs: [launch-arm-runner, build-arm]
    if: always() && needs.launch-arm-runner.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "gha-arm-runner@oranged-experimentation.iam.gserviceaccount.com"

      - name: Delete GCE ARM Instance
        run: |
          if [ -n "${{ needs.launch-arm-runner.outputs.instance-name }}" ]; then
            gcloud compute instances delete "${{ needs.launch-arm-runner.outputs.instance-name }}" \
              --project="${{ env.GCP_PROJECT }}" \
              --zone="${{ env.GCP_ZONE }}" \
              --quiet || true
          fi

  # ---------------------------------------------------------------------------
  # Step 6: Publish Release
  # ---------------------------------------------------------------------------
  publish:
    name: 📦 Publish GitHub Release
    needs: [check-upstream, build-x86, build-arm]
    if: always() && needs.check-upstream.outputs.should_build == 'true' && (needs.build-x86.result == 'success' || needs.build-arm.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS and Release Notes
        env:
          TARGET_TAG: ${{ needs.check-upstream.outputs.target_tag }}
        run: |
          cd dist
          sha256sum vector-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

          {
            echo "## Vector ${TARGET_TAG} (Hardware-Optimized Distribution)"
            echo ""
            echo "This release provides high-performance, hardware-optimized distributions of official Vector **${TARGET_TAG}**."
            echo ""
            echo "Upstream Release Notes: https://github.com/vectordotdev/vector/releases/tag/${TARGET_TAG}"
            echo ""
            echo "### Architecture & Optimization Details"
            echo "* **ARM64 (\`aarch64-unknown-linux-gnu-lse\`)**:"
            echo "  - Built natively on Google Cloud Axion C4A (ARM Neoverse-V2) using GCC 14 and Ubuntu 24.04 LTS."
            echo "  - Compiled with ARMv8.2-A Large System Extensions (\`+lse\`) and CRC32 (\`+crc\`) instructions (\`-march=armv8.2-a+lse+crc\`, \`-C target-feature=+lse,+crc\`)."
            echo "  - Recommended for Google Cloud Axion (C4A), AWS Graviton 2/3/4, GCP Tau T2A, and Ampere Altra/AmpereOne."
            echo "* **x86_64 (\`x86_64-unknown-linux-gnu-v3\`)**:"
            echo "  - Built using GCC 14 and \`x86-64-v3\` vector extensions (\`-march=x86-64-v3\`, \`-C target-cpu=x86-64-v3\`)."
            echo "  - Enables AVX, AVX2, BMI1, BMI2, FMA, F16C, and LZCNT vectorization."
            echo "  - Recommended for modern Intel and AMD cloud servers."
            echo ""
            echo "### Cryptographic Verification"
            echo "\`\`\`bash"
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "\`\`\`"
          } > ../release_notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ needs.check-upstream.outputs.target_tag }}
        run: |
          gh release create "${TARGET_TAG}" \
            --title "Vector ${TARGET_TAG} (Hardware-Optimized)" \
            --notes-file release_notes.md \
            dist/vector-*.tar.gz dist/SHA256SUMS
